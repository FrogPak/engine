name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rsvg-convert renders the icons and badge images, as in the publish workflow.
      - run: sudo apt-get update -q && sudo apt-get install -y -q python3-yaml librsvg2-bin
      - run: python3 -m unittest discover -s tests -t . -v

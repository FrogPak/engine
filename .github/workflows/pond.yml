# This workflow was renamed to publish-pond.yml in 1.1.2. It only fails with a
# notice, so Ponds still calling it learn what to change.
#
# It accepts the same inputs and secret as publish-pond.yml; otherwise GitHub
# would reject the call before the notice could be shown.

name: FrogPak Pond (renamed)

on:
  workflow_call:
    inputs:
      config:
        type: string
        default: ''
      force:
        type: boolean
        default: false
    secrets:
      GPG_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  renamed:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Update your workflow
        run: |
          echo "::error title=FrogPak workflow renamed::FrogPak's pond.yml is now publish-pond.yml. In .github/workflows/publish.yml, change FrogPak/engine/.github/workflows/pond.yml@v1 to FrogPak/engine/.github/workflows/publish-pond.yml@v1. Nothing was published; your site is unchanged."
          exit 1
